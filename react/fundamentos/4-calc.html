
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
        <title>Rocketseat - React.js - Fundamentos</title>
        <style type="text/tailwindcss">
            @theme {
                --text: #EBEBEB;
                --text-secondary: #6B6B6B;
                --primary: #462878;
                --background: #2D2A37;

                --gradient: 180deg,
                rgba(0, 0, 0, 0.05) 0%,
                rgba(255, 255, 255, 0.05) 100%;

                --gradient-hover: 180deg,
                rgba(0, 0, 0, 0.1) 0%,
                rgba(255, 255, 255, 0.1) 100%;

                --shadow: Opx 11px 7px Opx rgba(0, 0, 0, 0.01),
                Opx 7px 7px Opx rgba(0, 0, 0, 0.04),
                Opx 4px 6px Opx rgba(0, 0, 0, 0.10),
                Opx 2px 4px Opx rgba(0, 0, 0, 0.26),
                Opx Opx 2px Opx rgba (0, 0, 0, 0.29),
                0px 2px 3px Opx rgba(255, 255, 255, 0.06) inset;

                --font-sans: 'Rubik', sans-serif;
            }
        </style>
    </head>
    <body class="min-h-screen bg-linear-[180deg,_#807ECE_0%,_#807ECE_100%] text-(--text) font-(--font-sans)">
        <div id="root">div responsavel por renderizar aplicao no React.js</div>

        <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
        <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <script type="text/babel">

            let buttons = [
                [
                 { input: "CE" },
                 { input: "C", className: "flex-1 h-16" },
                 { input: "/", variant: "primary" }
                ],
                [
                 { input: "7" },
                 { input: "8" },
                 { input: "9" },
                 { input: "*", variant: "primary" }
                ],
                [
                 { input: "4" },
                 { input: "5" },
                 { input: "6" },
                 { input: "-", variant: "primary" }
                ],
                [
                 { input: "1" },
                 { input: "2" },
                 { input: "3" },
                 { input: "+", variant: "primary" }
                ],
                [
                 { input: "0", className: "flex-1 h-16" },
                 { input: "," },
                 { input: "=", variant: "primary" }
                ]
            ]

            const CalculatorContext = React.createContext()

            function CalculatorProvider({children}) {
                const [history, setHistory] = React.useState([])
                let historyStorageKey = 'calculatorHistory'

                React.useEffect(() => {
                    let storedHistory = localStorage.getItem(historyStorageKey)
                    if (storedHistory) {
                        setHistory(JSON.parse(storedHistory))
                    }
                }, [])

                function addHistory(operation, parsedResult) {
                    setHistory((prev) => {
                        let updateHistory = [...prev, `${operation} = ${parsedResult}`]
                        localStorage.setItem(historyStorageKey, JSON.stringify(updateHistory))
                        return updateHistory
                    })
                }

                function clearHistory() {
                    setHistory([])
                    localStorage.removeItem(historyStorageKey)
                }

                return (
                    <CalculatorContext.Provider
                        value = {{history, addHistory, clearHistory}}
                    >
                        {children}
                    </CalculatorContext.Provider>
                )
            }

            function useCalculator() {
                const [operation, setOperation] = React.useState("")
                const [result, setResult] = React.useState("")
                const { addHistory, clearHistory } = React.useContext(CalculatorContext)

                function performOperation(input) {
                     if (input === "=") {
                        const operationResult = eval(operation.replace(/,/g, "."))
                        const parsedResult = operationResult.toString().replace(/\./g, ",").toString()
                        setResult(parsedResult)
                        addHistory(operation, parsedResult)
                        return
                    }

                    if (input === "C") {
                        setOperation("")
                        setResult("")
                        clearHistory()
                        return
                    }

                    if (input === "CE") {
                        setResult("")
                        setOperation(operation.slice(0, -1))
                        return
                    }

                    if (result) {
                        setOperation(
                            isNaN(input)
                            ? `${result}${input}` 
                            : input
                        )
                        setResult("")
                        return
                    }

                    if (input === "," && !operation.endsWith(",")) {
                        setOperation(`${operation},`)
                        return
                    }
                    
                    setOperation(
                        `${operation}${input}`
                    )
                }

                return {
                    operation,
                    result,
                    performOperation
                }
            }

            const textVariants = {
                default: 'text-xl',
                secondary: 'text-xl text-(--text-secondary)',
                heading: 'text-2xl',
                blast: 'text-3xl'
            }

            const Text = ({as = 'span', variant = 'default', className, children, ...props}) =>  {
                return React.createElement(
                    as,
                    {
                        className: `${textVariants[variant]} ${className ? className : ''}`,
                        ...props
                    },
                    children
                )
            }

            const Card = ({children, className, ...props}) =>  {
                return (
                    <div 
                    className = {`
                        bg-(--background)
                        shadow-(--shadow)
                        rounded-2xl
                        ${className? className : ''}
                        `}
                        {...props}
                        >
                        {children}
                    </div>
                )
            }

            const buttonVariants = {
                default: 'bg-(--background)',
                primary: 'bg-(--primary)'
            }

            const Button = ({
                variant='default', 
                children, className, 
                onClick,
                ...props
            }) =>  {
                return <Text
                as = "button"
                variant = "heading"
                className = {`
                    flex items-center justify-center rounded-xl
                    p-3 cursor-pointer text-(--text) 
                    bg-linear-(--gradient)
                    hover:bg-linear-(--gradient-hover)
                    shadow-(--shadow)
                    ${buttonVariants[variant]}
                    ${className? className : ''}
                `}
                onClick = {onClick}
                {...props}
                >
                    {children}
                </Text>
            }

            const CalculatorDisplay = ({operation, result}) =>  {
                return (
                    <div className = {`
                            flex 
                            flex-col 
                            gap-2
                            px-[1.375rem]
                            cursor-default
                            select-none
                            `}>
                            <Text 
                            as = "div"
                            className = {`
                                flex 
                                items-center
                                justify-end
                                h-7
                                `}>
                                {result && operation}
                            </Text>
                            <div className = {`
                                flex
                                items-center
                                justify-between
                                h-9
                                `}>
                                <Text>=</Text>
                                <Text variant = "blast">{result || operation}</Text>
                            </div>

                        </div>

                )
            }
            
            const Calculator = () =>  {
                const { operation, result, performOperation } = useCalculator()

                function handleButtonClick(input) {
                    performOperation(input)
                }

                return (
                    <Card className = {`
                        flex 
                        flex-col 
                        gap-[1.625rem] 
                        w-[22.25rem]
                        pt-14
                        px-8
                        pb-8
                        `}>
                        <CalculatorDisplay operation = {operation} result = {result} />
                        <div className = "flex flex-col gap-3">
                            {
                                buttons.map(
                                    (row, index) => (
                                        <div key = {`${row}-${index}`} className = "flex gap-3">
                                            {row.map(button => (
                                                    <Button
                                                        key = {button.input}
                                                        onClick = {() => handleButtonClick(button.input)}
                                                        variant = {button.variant}
                                                        className = {button.className || 'w-16 h-16'}
                                                    >
                                                        {button.input}
                                                    </Button>
                                            ))}
                                        </div>
                                    )
                                )
                            }
                        </div>
                    </Card>
                )
            }

            const OperationHistory = () => {
                const { history } = React.useContext(CalculatorContext)
                return (
                    <Card className = "w-full py-10 px-8">
                        <Text as = "h1" variant = "heading" className = "mb-4">Historico de Operacoes</Text>
                        {
                            history.length > 0 ? (
                                <ul className = "flex flex-col gap-3">
                                    {
                                        history.map(
                                            (value, index) => 
                                            <Text key = {`history-item-${index}`} as = "li">
                                                {value}
                                            </Text>
                                        )
                                    }
                                </ul>
                            ) : (
                                <Text as = "p" variant = "muted" className = "mb-4">Nenhum resultado.</Text>
                            )
                        }
                    </Card>
                )
            }

            const App = () => {
                return (
                    <main className = {`
                        py-28 
                        px-4
                        sm:px-10
                        flex 
                        flex-col
                        sm:flex-row
                        items-center
                        sm:items-stretch
                        gap-2
                        `}>
                        <CalculatorProvider>
                            <Calculator listButtons = {buttons} />
                            <OperationHistory />
                        </CalculatorProvider>
                    </main>
                );
            }

           // Renderiza o titulo na div com id "root"
           // Utiliza o ReactDOM.createRoot() para renderizar o componente na raiz do documento
            ReactDOM.createRoot(document.getElementById('root'))
           .render(
                <App />
           )
        </script>
    </body>
</html>
