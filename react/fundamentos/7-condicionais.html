<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rocketseat - React.js - Fundamentos</title>
    </head>
    <body>
        <div id="root">div responsavel por renderizar aplicao no React.js</div>
        
        <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <script type="text/babel">

            const Counter = () =>  {
                const [counter, setCounter] = React.useState(0)
                return (
                    <>

                        <h1>Contador: {counter}</h1>
                        <h2>Condicionais</h2>
                        <p>{counter > 10 ? 'Maior que 10' : 'Menor que 10'}</p>
                        {counter >= 15 && <p>Soh aparece se contador for maior ou igual a 15</p>}
                        <button onClick = {() => setCounter(counter+1)}>Incrementar</button>
                        <button onClick = {() => setCounter(counter-1)}>Decrementar</button>
                        <button onClick = {() => setCounter((prevValue) => prevValue + 1)}>Incrementar com prev value</button>
                        <button onClick = {() => setCounter((prevValue) => prevValue - 1)}>Decrementar com prev value</button>
                    </>
                )
            }

            const App = () => {
                return (
                    <main>
                        <Counter />
                    </main>
                );
            }

           // Renderiza o titulo na div com id "root"
           // Utiliza o ReactDOM.createRoot() para renderizar o componente na raiz do documento
            ReactDOM.createRoot(document.getElementById('root'))
           .render(
                <App />
           )
        </script>
    </body>
</html>
